<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>따릉이 예측 나침반 (AI 3H Forecast)</title>
    <style>
        /* 글로벌 세련된 모던 다크/라이트 하이브리드 네이티브 디자인 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif; 
            background: #f8fafc; 
            color: #1e293b;
            margin: 0; 
            padding: 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 90vh; 
        }
        
        /* 메인 대시보드 초경량 카드 */
        .dashboard-card { 
            background: white; 
            padding: 32px 24px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
            box-sizing: border-box;
        }

        .title-badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 100px;
            display: inline-block;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 8px 0; color: #0f172a; }
        .subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 32px; line-height: 1.5; }
        
        /* 햅틱 반응 유도용 고성능 메인 버튼 */
        .action-btn { 
            background: #0f172a; 
            color: white; 
            border: none; 
            padding: 16px; 
            font-size: 1rem; 
            border-radius: 16px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 700; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }
        .action-btn:active { transform: scale(0.98); background: #1e293b; }
        .action-btn:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

        /* 우와 소리 나오는 다이내믹 AI 리포트 결과 컨테이너 박스 */
        .result-container { 
            margin-top: 24px; 
            padding: 20px; 
            border-radius: 20px; 
            display: none; /* 초기 상태 숨김 */
            text-align: left; 
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 상태별 알림 컬러 명세 스펙 */
        .RED { background: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
        .GREEN { background: #f0fdf4; color: #166534; border: 1px solid #dcfce7; }
        .BLUE { background: #f0f9ff; color: #075985; border: 1px solid #e0f2fe; }

        .station-header { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; color: inherit; }
        .data-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.95rem; }
        .data-label { opacity: 0.8; }
        .data-value { font-weight: 700; }
        .highlight-value { font-size: 1.3rem; font-weight: 900; }

        .divider { border: 0; border-top: 1px solid currentColor; opacity: 0.15; margin: 16px 0; }
        .ai-analysis { font-size: 0.9rem; font-weight: 600; line-height: 1.5; margin: 0; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <span class="title-badge">Real-time ML Engine</span>
    <h1>따릉이 예측 나침반</h1>
    <p class="subtitle">지도를 켜지 않아도 내 위치 주변 대여소의<br><strong>3시간 뒤 고갈 현황</strong>을 AI가 예보합니다.</p>
    
    <button class="action-btn" id="predictBtn" onclick="initiateSearch()">내 주변 대여소 상황 조회</button>

    <!-- [2단계에서 데이터가 꽂힐 결과창 인터페이스 영역] -->
    <div id="resultBox" class="result-container">
        <div class="station-header" id="uiStationName">대여소 로드 중...</div>
        
        <div class="data-row">
            <span class="data-label">현재 잔여 수량</span>
            <span class="data-value"><span id="uiCurrentBikes">0</span>대</span>
        </div>
        <div class="data-row">
            <span class="data-label">현재 대기 기온</span>
            <span class="data-value" id="uiWeather">0.0°C</span>
        </div>
        
        <div class="divider"></div>
        
        <div class="data-row" style="align-items: center;">
            <span class="data-label">🧠 3시간 뒤 예측</span>
            <span class="data-value highlight-value"><span id="uiPredictedBikes">0</span>대</span>
        </div>
        
        <div class="divider"></div>
        
        <p class="ai-analysis" id="uiAnalysisText"></p>
    </div>
</div>

<!-- 2, 3단계 스크립트 소스코드가 이 아래에 결합됩니다 -->


   <script>
    // 💡 [배포 핵심 팁] Render 백엔드 서비스를 배포한 뒤 생성되는 무료 도메인 URL로 교체하세요.
    // 로컬 환경 테스트 시에는 "http://127.0.0.1:8000" 을 사용합니다.
    const BACKEND_API_URL = "https://onrender.com"; 

    function initiateSearch() {
        const btn = document.getElementById('predictBtn');
        const resultBox = document.getElementById('resultBox');
        
        // 1. 중복 요청 방지 및 우와 소리 나오는 로딩 피드백 애니메이션 효과
        btn.innerText = "⚡ GPS 수신 및 AI 연산 중...";
        btn.disabled = true;
        resultBox.style.display = "none";

        // 2. 브라우저가 GPS 하드웨어를 지원하는지 방어적 체크
        if (!navigator.geolocation) {
            alert("❌ 이 브라우저는 GPS 위치 정보 수신을 지원하지 않습니다.");
            resetButton();
            return;
        }

        // 3. 네이티브 고정밀 위치 추적(High Accuracy) 시동
        const geoOptions = {
            enableHighAccuracy: true, // 와이파이, 기지국, GPS 통합 고정밀 좌표 요청
            timeout: 7000,            // 7초 내에 수신 불가 시 타임아웃
            maximumAge: 0             // 캐시된 이전 위치를 쓰지 않고 항상 실시간 측정
        };

        navigator.geolocation.getCurrentPosition(
            // [성공 콜백] 좌표를 정상적으로 획득했을 때 (3단계 비동기 API 통신부와 결합됨)
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                // 전송할 좌표 검증용 디버깅 로그 (브라우저 콘솔에서 확인 가능)
                console.log(`[GPS 수신 성공] 위도: ${lat}, 경도: ${lon}`);
                
                // 3단계의 실제 API 백엔드 호출 함수로 좌표를 던집니다.
                requestAIPrediction(lat, lon);
            },
            // [실패 콜 callback] 사용자가 거부했거나 GPS 신호가 잡히지 않을 때
            (error) => {
                let errorMsg = "위치 정보를 가져오는 데 실패했습니다.";
                if (error.code === error.PERMISSION_DENIED) {
                    errorMsg = "🔒 위치 권한 승인이 거부되었습니다. 브라우저 설정에서 권한을 허용해 주세요.";
                } else if (error.code === error.TIMEOUT) {
                    errorMsg = "⏳ 위치 측정 시간이 초과되었습니다. 신호가 좋은 곳에서 다시 시도해 주세요.";
                }
                alert(errorMsg);
                resetButton();
            },
            geoOptions
        );
    }

    function resetButton() {
        const btn = document.getElementById('predictBtn');
        btn.innerText = "내 주변 대여소 상황 조회";
        btn.disabled = false;
    }
</script>
</body>
</html>
